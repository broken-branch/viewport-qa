name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance via OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Check the tag matches version.json
        run: |
          version="$(node -p 'require("./version.json").version')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version.json ($version)" >&2
            exit 1
          fi

      - run: pnpm run package:npm
      - run: pnpm run package:test

      - name: Pack the tarball
        run: cd dist/npm && npm pack --pack-destination ..

      - name: Publish to npm
        run: npm publish --provenance --access public dist/viewport-qa-*.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/viewport-qa-*.tgz --generate-notes --verify-tag
