name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11 && npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Check the tag matches version.json
        run: |
          version="$(node -p 'require("./version.json").version')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version.json ($version)" >&2
            exit 1
          fi

      - run: pnpm run package:npm
      - run: pnpm run package:test

      - name: Pack the tarball
        run: cd dist/npm && npm pack --pack-destination ..

      # No token: npm exchanges this job's OIDC identity for a short-lived
      # publish credential, which works only for the trusted publisher
      # configured on npmjs.com (this repository, release.yml). A version
      # that is already on npm is left alone, so a re-run after a later
      # step failed still finishes the release.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "viewport-qa@$version" version >/dev/null 2>&1; then
            echo "viewport-qa@$version is already on npm; not publishing again"
          else
            npm publish --provenance --access public dist/viewport-qa-*.tgz
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/viewport-qa-*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/viewport-qa-*.tgz \
              --title "${GITHUB_REF_NAME}" --notes-file dist/release-notes.md --verify-tag
          fi
